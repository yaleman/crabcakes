version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
      day: saturday
      time: "02:00"
      timezone: Australia/Brisbane
    groups:
      cargo:
        patterns:
          - "*"
  - package-ecosystem: github-actions
    directory: /
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
      day: saturday
      time: "02:00"
      timezone: Australia/Brisbane
    groups:
      github-actions:
        patterns:
          - "*"
