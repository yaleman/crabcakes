version: 2
updates:
- package-ecosystem: cargo
  directory: /
  schedule:
    interval: weekly
    day: saturday
    time: 02:00
    timezone: Australia/Brisbane
  groups:
    cargo:
      patterns:
      - '*'
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: weekly
    day: saturday
    time: 02:00
    timezone: Australia/Brisbane
  groups:
    github-actions:
      patterns:
      - '*'
