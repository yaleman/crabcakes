---
name: JavaScript and TypeScript Checks

"on":
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  js-checks:
    name: JavaScript and TypeScript Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
      - name: Run JavaScript tests
        run: mise run js-test
      - name: Install Playwright Chromium
        run: mise exec -- pnpm exec playwright install --with-deps chromium
      - name: Run Playwright tests
        run: mise exec -- pnpm test:playwright
      - name: Check for outstanding changes
        run: |
          ./scripts/git-pre-commit.sh
